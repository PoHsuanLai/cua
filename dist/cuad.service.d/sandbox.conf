# cuad's mount-namespace protections.
# Why this is a separate file: each setting below gives the daemon a private view of the file
# system, the network, the devices or the kernel. In a user manager (systemd --user) that needs an
# unprivileged user namespace, and some systems refuse it: Ubuntu 24.04 and later turn it off for
# programs without an AppArmor profile, and the unit then fails to start with 226/NAMESPACE. The
# installer (scripts/install.sh) tests for that and installs this file only where it works. What
# needs no namespace (the system-call filter, no new privileges, no capabilities, the address
# families, the resource limits) stays in the unit.
[Service]
# Nothing can reach the network, so a compromised cuad cannot send what it sees anywhere. (All
# the sockets it uses are filesystem Unix sockets, so this does not cut them off.)
PrivateNetwork=yes
# The person's files are out of reach: cuad never reads or writes them. A step's thumbnail is
# stored by memoryd in the Space's encrypted store, and only when `cua.screens.keep` is on.
ProtectHome=yes
# The whole file system is read-only; nothing is writable. Frames live in memory (memfds) and
# are never written to disk.
ProtectSystem=strict
ReadWritePaths=
PrivateTmp=yes
# No devices at all: capture is shared memory, never a GPU or an input node. (uinput, in any
# form, is never used: input goes through the compositor's EIS server.)
PrivateDevices=yes
# No kernel, module or debug surfaces.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
