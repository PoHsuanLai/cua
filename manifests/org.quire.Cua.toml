# The `org.quire.Cua` provider, served by cuad: how the planner starts a computer-use run in a
# third-party window. Starting a run is a read (it changes nothing by itself): every pixel step
# the run takes is gated on its own through `Intents1.Gate.Check`, and the person's consent for
# the app is asked through `Gate.Grant` on first use. The run's result is not this action's
# value: it is a `prov::Message` of kind Report in the requester's inbox. This action returns the
# run's id once the run has begun. `reach` is `hidden` while `cua.enabled` is off: cuad rewrites
# it when the setting is on. Every field is written (porter's provider-file rule).
vocab = 1
app = "org.quire.Cua"

[[entities]]
kind = "desktop.window"
label = "Window"
plural = "Windows"
icon = "window"
class = "screen"
index = "not_indexed"
titles = { kind = "third_party", v = { kind = "screen", v = { app = "org.quire.Cua" } } }
props = []

[[actions]]
name = "cua.run.start"
label = "Do this on screen"
on = { kind = "nothing" }
effect = "read"
classes = ["screen"]
undo = "not_undoable"
reach = "hidden"
latency = "long"
result = { kind = "value", v = { ty = { kind = "text", v = { max = 64, lines = "one" } }, trust = { kind = "app_authored" } } }
keys = { kind = "none" }
lasting = "no"
dry_run = "none"

[[actions.params]]
name = "goal"
label = "What to do"
ty = { kind = "text", v = { max = 2000, lines = "many" } }
need = { kind = "required" }
sink = "body"

[[actions.params]]
name = "window"
label = "Window"
ty = { kind = "entity", v = "desktop.window" }
need = { kind = "optional" }
sink = "inert"

[[actions.params]]
name = "app"
label = "App"
ty = { kind = "text", v = { max = 128, lines = "one" } }
need = { kind = "optional" }
sink = "inert"

[[actions.params]]
name = "mode"
label = "Where to run"
ty = { kind = "choice", v = [
  { id = "auto", label = "Automatic" },
  { id = "in_place", label = "In place" },
  { id = "agent_workspace", label = "Agent workspace" },
] }
need = { kind = "defaulted", v = { kind = "choice", v = "auto" } }
sink = "inert"
