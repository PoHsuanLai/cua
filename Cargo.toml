[workspace]
resolver = "3"
members = [
  "crates/cua-desktop",
  "crates/maskcap",
  "crates/seat-input",
  "crates/a11y-tree",
  "crates/cua-bus",
  "crates/cua-run",
  "crates/cua-dbus",
  "crates/cua-fake",
  "crates/cuad",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/cua"
publish = false

[workspace.dependencies]
a11y-tree             = { path = "crates/a11y-tree" }
seat-input            = { path = "crates/seat-input" }
maskcap               = { path = "crates/maskcap" }
cua-desktop           = { path = "crates/cua-desktop" }
cua-bus               = { path = "crates/cua-bus" }
cua-run               = { path = "crates/cua-run" }
cua-dbus              = { path = "crates/cua-dbus" }
cua-fake              = { path = "crates/cua-fake" }

# The one home of every quire_*_v1 protocol: the XML, the vocabulary, the bindings (sibling path).
casement-protocols    = { path = "../casement-protocols" }

# stoker's frozen interfaces, by sibling path until a pinned git rev replaces them (quire
# CONSUMING.md section 1). stoker has no cua dependency, so there is no cycle.
cua-action      = { path = "../stoker/crates/cua-action" }
model-provider  = { path = "../stoker/crates/model-provider" }
model-replay    = { path = "../stoker/crates/model-replay" }
cua-parse       = { path = "../stoker/crates/cua-parse" }

# porter's frozen interfaces.
porter-core     = { path = "../porter/crates/porter-core" }
prov            = { path = "../porter/crates/prov" }
porter-infer    = { path = "../porter/crates/porter-infer" }
porter-client   = { path = "../porter/crates/porter-client" }

# almanac's frozen interfaces: cuad records `CuaRecord`s as `EventBody::Area` through memoryd.
almanac-core    = { path = "../almanac/crates/almanac-core" }
almanac-client  = { path = "../almanac/crates/almanac-client" }

# docket's frozen interfaces: the gate contract (`CuaAsk`, `GateAnswer`, `RunMode`,
# `WindowTrust`), the message draft and the provider trait. docket sits below cua and has no cua
# dependency.
docket-core     = { path = "../docket/crates/docket-core" }
docket-client   = { path = "../docket/crates/docket-client" }

# Dev-dependencies of cuad's tests only: a real intentd on a private bus over docket's fakes, and
# a real memory service over almanac's fakes. Nothing outside `[dev-dependencies]` names them.
intentd         = { path = "../docket/crates/intentd" }
docket-fake     = { path = "../docket/crates/docket-fake" }
docket-router   = { path = "../docket/crates/docket-router" }
almanac-fake    = { path = "../almanac/crates/almanac-fake" }
almanac-service = { path = "../almanac/crates/almanac-service" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines cua
# names itself.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8.2"
keyboard-types = { version = "0.7", features = ["serde"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }  # porter's line, narrowed to what cuad names: memfd_create and its seals
wayland-client = "0.31"
# libxkbcommon, narrowed: seat-input reads the keymap text only (no wayland keymap fds).
xkbcommon = { version = "0.8", default-features = false }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# The minor cosmic-comp's lock resolves.
reis = "0.7"
base64 = "0.22"
blake3 = "1"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
# docket's line: cuad waits for its bus connection to close.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Dev-dependencies.
proptest = "1"
tempfile = "3"

# NOT in quire's pinned block (FINDINGS: dependencies added here): the generator and the server
# side of the wayland crates, both already in every tree through wayland-protocols and
wayland-scanner = "0.31"
wayland-server  = "0.31"
wayland-backend = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
