[workspace]
resolver = "3"
members = [
  "crates/cua-desktop",
  "crates/cua-types",
  "crates/maskcap",
  "crates/seat-input",
  "crates/a11y-tree",
  "crates/cua-bus",
  "crates/cua-run",
  "crates/cua-host",
  "crates/cua-dbus",
  "crates/cua-fake",
  "crates/cuad",
  "crates/cua-eval",
  "crates/cua-eval-cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/cua"
publish = false

[workspace.dependencies]
a11y-tree             = { path = "crates/a11y-tree" }
seat-input            = { path = "crates/seat-input" }
maskcap               = { path = "crates/maskcap" }
cua-desktop           = { path = "crates/cua-desktop" }
cua-types             = { path = "crates/cua-types" }
cua-bus               = { path = "crates/cua-bus" }
cua-run               = { path = "crates/cua-run" }
cua-host              = { path = "crates/cua-host" }
cua-dbus              = { path = "crates/cua-dbus" }
cua-fake              = { path = "crates/cua-fake" }
cua-eval              = { path = "crates/cua-eval" }
cua-eval-cloud        = { path = "crates/cua-eval-cloud" }

# The one home of every quire_*_v1 protocol: the XML, the vocabulary, the bindings (by git at a pinned rev; a local checkout overrides it through a [patch], FINDINGS.md).
casement-protocols    = { git = "https://github.com/PoHsuanLai/casement-protocols", rev = "8cebc9b498e4e5d5b9ec1b1d7b52e2641d5c094b" }

# stoker's frozen interfaces, by git at a pinned rev (quire
# CONSUMING.md section 1). stoker has no cua dependency, so there is no cycle.
cua-action      = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
model-provider  = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
model-replay    = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
cua-parse       = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
# cua-eval only: the live model path (the session that builds a step's prompt, the catalogue entry it reads, the HTTP client and the chat codec, the image preparation).
cua-vendors     = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
cua-session     = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
model-catalog   = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
model-http      = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
model-openai-compat = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }
vision-prep     = { git = "https://github.com/PoHsuanLai/stoker", rev = "45c5a8947f2caa735688ef55f8be012d5fe346a9" }

# porter's frozen interfaces.
porter-core     = { git = "https://github.com/PoHsuanLai/porter", rev = "475dd65b8a289f3836b12cd90e367763f6c9e13f" }
prov            = { git = "https://github.com/PoHsuanLai/porter", rev = "475dd65b8a289f3836b12cd90e367763f6c9e13f" }
porter-infer    = { git = "https://github.com/PoHsuanLai/porter", rev = "475dd65b8a289f3836b12cd90e367763f6c9e13f" }
porter-client   = { git = "https://github.com/PoHsuanLai/porter", rev = "475dd65b8a289f3836b12cd90e367763f6c9e13f" }
porter-daemon   = { git = "https://github.com/PoHsuanLai/porter", rev = "475dd65b8a289f3836b12cd90e367763f6c9e13f" }

# chordkit: the portable keymap core. cua reads the desktop's shortcut conventions from it (a
# Keymap and a Platform) and restates none of them.
chordkit        = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "934a2d71f6516bee5919ee29278003702a4ea5e1" }
# keycap's client: this desktop's chordkit source, with the person's own overrides. cuad only, behind its `keycap` feature.
keycap-client   = { git = "https://github.com/PoHsuanLai/keycap", rev = "be632d80546928860197eaae8ef4e350641b08f5" }

# almanac's frozen interfaces: cuad records `CuaRecord`s as `EventBody::Area` through memoryd.
almanac-core    = { git = "https://github.com/PoHsuanLai/almanac", rev = "1963cb55d4ba90a54460ee510b5aabddceeedbb4" }
almanac-client  = { git = "https://github.com/PoHsuanLai/almanac", rev = "1963cb55d4ba90a54460ee510b5aabddceeedbb4", default-features = false }

# docket's frozen interfaces: the gate contract (`CuaAsk`, `GateAnswer`, `RunMode`,
# `WindowTrust`), the message draft and the provider trait. docket sits below cua and has no cua
# dependency.
docket-core     = { git = "https://github.com/PoHsuanLai/docket", rev = "c67929dd060609ce5c039ce87ff0f43507c935a6" }
docket-client   = { git = "https://github.com/PoHsuanLai/docket", rev = "c67929dd060609ce5c039ce87ff0f43507c935a6", default-features = false }
# Who is calling a daemon: porter's process identity (`Identity`, `Standing`, the callers table), the one way every daemon of the agent tier asks.
docket-dbus     = { git = "https://github.com/PoHsuanLai/docket", rev = "c67929dd060609ce5c039ce87ff0f43507c935a6" }

# Dev-dependencies of cuad's tests only: a real intentd on a private bus over docket's fakes, and
# a real memory service over almanac's fakes. Nothing outside `[dev-dependencies]` names them.
intentd         = { git = "https://github.com/PoHsuanLai/docket", rev = "c67929dd060609ce5c039ce87ff0f43507c935a6" }
docket-fake     = { git = "https://github.com/PoHsuanLai/docket", rev = "c67929dd060609ce5c039ce87ff0f43507c935a6" }
docket-router   = { git = "https://github.com/PoHsuanLai/docket", rev = "c67929dd060609ce5c039ce87ff0f43507c935a6" }
almanac-fake    = { git = "https://github.com/PoHsuanLai/almanac", rev = "1963cb55d4ba90a54460ee510b5aabddceeedbb4" }
almanac-service = { git = "https://github.com/PoHsuanLai/almanac", rev = "1963cb55d4ba90a54460ee510b5aabddceeedbb4" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines cua
# names itself.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8.2"
keyboard-types = { version = "0.7", features = ["serde"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }  # porter's line, narrowed to what cuad names: memfd_create and its seals
wayland-client = "0.31"
# libxkbcommon, narrowed: seat-input reads the keymap text only (no wayland keymap fds).
xkbcommon = { version = "0.8", default-features = false }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# Pinned at this minor so the repos that share this crate stay on one version.
reis = "0.7"
base64 = "0.22"
blake3 = "1"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
# docket's line: cuad waits for its bus connection to close.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Dev-dependencies.
proptest = "1"
tempfile = "3"

# NOT in quire's pinned block (FINDINGS: dependencies added here): the generator and the server
# side of the wayland crates, both already in every tree through wayland-protocols and
wayland-scanner = "0.31"
wayland-server  = "0.31"
wayland-backend = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
