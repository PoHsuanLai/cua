[workspace]
resolver = "3"
members = [
  "crates/cua-desktop",
  "crates/cua-types",
  "crates/maskcap",
  "crates/seat-input",
  "crates/a11y-tree",
  "crates/a11y-atspi",
  "crates/seat-ei",
  "crates/maskcap-wayland",
  "crates/cua-bus",
  "crates/cua-run",
  "crates/cua-host",
  "crates/cua-dbus",
  "crates/cua-fake",
  "crates/cua-system",
  "crates/cuad",
  "crates/cua-eval",
  "crates/cua-eval-cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/cua"
publish = false

[workspace.dependencies]
a11y-tree             = { path = "crates/a11y-tree" }
a11y-atspi            = { path = "crates/a11y-atspi" }
seat-ei               = { path = "crates/seat-ei" }
maskcap-wayland       = { path = "crates/maskcap-wayland" }
cua-system            = { path = "crates/cua-system" }
seat-input            = { path = "crates/seat-input" }
maskcap               = { path = "crates/maskcap" }
cua-desktop           = { path = "crates/cua-desktop" }
cua-types             = { path = "crates/cua-types" }
cua-bus               = { path = "crates/cua-bus" }
cua-run               = { path = "crates/cua-run" }
cua-host              = { path = "crates/cua-host" }
cua-dbus              = { path = "crates/cua-dbus" }
cua-fake              = { path = "crates/cua-fake" }
cua-eval              = { path = "crates/cua-eval" }
cua-eval-cloud        = { path = "crates/cua-eval-cloud" }

# The one home of every quire_*_v1 protocol: the XML, the vocabulary, the bindings (by git at a pinned rev; a local checkout overrides it through a [patch], FINDINGS.md).
casement-protocols    = { git = "https://github.com/PoHsuanLai/casement-protocols", rev = "3a8b37153f3569cb604ba5b2daf8480444e543f3" }
# cua-system's casement backend: the window model over the agent connection (the `client` feature binds the globals).
desktop-client        = { git = "https://github.com/PoHsuanLai/casement-protocols", rev = "3a8b37153f3569cb604ba5b2daf8480444e543f3", features = ["client"] }

# stoker's frozen interfaces, by git at a pinned rev (quire
# CONSUMING.md section 1). stoker has no cua dependency, so there is no cycle.
cua-action      = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
model-provider  = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
model-replay    = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
cua-parse       = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
# cua-eval only: the live model path (the session that builds a step's prompt, the catalogue entry it reads, the HTTP client and the chat codec, the image preparation).
cua-vendors     = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
cua-session     = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
model-catalog   = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
model-http      = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
model-openai-compat = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }
vision-prep     = { git = "https://github.com/PoHsuanLai/stoker", rev = "c8fed624534867659448ac417992bac4f0f47e28" }

# porter's frozen interfaces.
porter-core     = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-ids      = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-capability = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-match    = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-wire     = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
prov            = { git = "https://github.com/PoHsuanLai/prov", rev = "f6cc175c4c6d815b6faa3d58b7875ca00def836d" }
porter-infer    = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-client   = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7", features = ["infer"] }
porter-daemon   = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }

# chordkit: the portable keymap core. cua reads the desktop's shortcut conventions from it (a
# Keymap and a Platform) and restates none of them.
chordkit        = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }
# keycap's client: this desktop's chordkit source, with the person's own overrides. cuad only, behind its `keycap` feature.
keycap-client   = { git = "https://github.com/PoHsuanLai/keycap", rev = "bc3d41754fa716f4183c901915f95b70a5c4d0b8" }

# almanac's frozen interfaces: cuad records `CuaRecord`s as `EventBody::Area` through memoryd.
almanac-core    = { git = "https://github.com/PoHsuanLai/almanac", rev = "f98261aa54adf78bf8f8cb7252a73ed638e58f49" }
almanac-client  = { git = "https://github.com/PoHsuanLai/almanac", rev = "f98261aa54adf78bf8f8cb7252a73ed638e58f49", default-features = false }

# docket's frozen interfaces: the gate contract (`CuaAsk`, `GateAnswer`, `RunMode`,
# `WindowTrust`), the message draft and the provider trait. docket sits below cua and has no cua
# dependency.
docket-core     = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-vocab    = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-manifest = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-permissions-core = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-wire     = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-gate-wire = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-client   = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67", default-features = false }
docket-provider = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
# Who is calling a daemon: porter's process identity (`Identity`, `Standing`, the callers table), the one way every daemon of the agent tier asks.
docket-dbus     = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }

# Dev-dependencies of cuad's tests only: a real intentd on a private bus over docket's fakes, and
# a real memory service over almanac's fakes. Nothing outside `[dev-dependencies]` names them.
intentd         = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-fake     = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
docket-router   = { git = "https://github.com/PoHsuanLai/docket", rev = "7bb397e5b4e95ab9ec95dea56d93690bc6c13e67" }
almanac-fake    = { git = "https://github.com/PoHsuanLai/almanac", rev = "f98261aa54adf78bf8f8cb7252a73ed638e58f49" }
almanac-service = { git = "https://github.com/PoHsuanLai/almanac", rev = "f98261aa54adf78bf8f8cb7252a73ed638e58f49" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines cua
# names itself.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8.2"
keyboard-types = { version = "0.7", features = ["serde"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }  # porter's line, narrowed to what cua-system and maskcap-wayland name: memfd_create and its seals
wayland-client = "0.31"
# libxkbcommon, narrowed: seat-input reads the keymap text only (no wayland keymap fds).
xkbcommon = { version = "0.8", default-features = false }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# Pinned at this minor so the repos that share this crate stay on one version.
reis = "0.7"
base64 = "0.22"
blake3 = "1"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
# docket's line: cuad waits for its bus connection to close.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# model-provider's `Money`: an exact decimal amount and an ISO 4217 currency (same versions as porter, stoker and docket).
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
iso_currency = { version = "0.7", features = ["with-serde"] }
# Dev-dependencies.
proptest = "1"
tempfile = "3"

# NOT in quire's pinned block (FINDINGS: dependencies added here): the generator and the server
# side of the wayland crates, both already in every tree through wayland-protocols and
wayland-scanner = "0.31"
wayland-server  = "0.31"
wayland-backend = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
