[workspace]
resolver = "3"
members = [
  "crates/cua-desktop",
  "crates/cua-types",
  "crates/maskcap",
  "crates/seat-input",
  "crates/a11y-tree",
  "crates/cua-bus",
  "crates/cua-run",
  "crates/cua-host",
  "crates/cua-dbus",
  "crates/cua-fake",
  "crates/cuad",
  "crates/cua-eval",
  "crates/cua-eval-cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/cua"
publish = false

[workspace.dependencies]
a11y-tree             = { path = "crates/a11y-tree" }
seat-input            = { path = "crates/seat-input" }
maskcap               = { path = "crates/maskcap" }
cua-desktop           = { path = "crates/cua-desktop" }
cua-types             = { path = "crates/cua-types" }
cua-bus               = { path = "crates/cua-bus" }
cua-run               = { path = "crates/cua-run" }
cua-host              = { path = "crates/cua-host" }
cua-dbus              = { path = "crates/cua-dbus" }
cua-fake              = { path = "crates/cua-fake" }
cua-eval              = { path = "crates/cua-eval" }
cua-eval-cloud        = { path = "crates/cua-eval-cloud" }

# The one home of every quire_*_v1 protocol: the XML, the vocabulary, the bindings (by git at a pinned rev; a local checkout overrides it through a [patch], FINDINGS.md).
casement-protocols    = { git = "https://github.com/PoHsuanLai/casement-protocols", rev = "a0ca1740bf3be9d5ce662bfda58cb73cfcd00e48" }

# stoker's frozen interfaces, by git at a pinned rev (quire
# CONSUMING.md section 1). stoker has no cua dependency, so there is no cycle.
cua-action      = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-provider  = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-replay    = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
cua-parse       = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
# cua-eval only: the live model path (the session that builds a step's prompt, the catalogue entry it reads, the HTTP client and the chat codec, the image preparation).
cua-vendors     = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
cua-session     = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-catalog   = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-http      = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
model-openai-compat = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }
vision-prep     = { git = "https://github.com/PoHsuanLai/stoker", rev = "9e4ba527e368a57c40b73c59da2de0cd867e5e03" }

# porter's frozen interfaces.
porter-core     = { git = "https://github.com/PoHsuanLai/porter", rev = "6b1adee23a4bb515e63ccc1bcc89b6eee3aef802" }
prov            = { git = "https://github.com/PoHsuanLai/porter", rev = "6b1adee23a4bb515e63ccc1bcc89b6eee3aef802" }
porter-infer    = { git = "https://github.com/PoHsuanLai/porter", rev = "6b1adee23a4bb515e63ccc1bcc89b6eee3aef802" }
porter-client   = { git = "https://github.com/PoHsuanLai/porter", rev = "6b1adee23a4bb515e63ccc1bcc89b6eee3aef802" }
porter-daemon   = { git = "https://github.com/PoHsuanLai/porter", rev = "6b1adee23a4bb515e63ccc1bcc89b6eee3aef802" }

# almanac's frozen interfaces: cuad records `CuaRecord`s as `EventBody::Area` through memoryd.
almanac-core    = { git = "https://github.com/PoHsuanLai/almanac", rev = "a3a8a105c808ac54eb037083fb1a0217e9d6fbb1" }
almanac-client  = { git = "https://github.com/PoHsuanLai/almanac", rev = "a3a8a105c808ac54eb037083fb1a0217e9d6fbb1", default-features = false }

# docket's frozen interfaces: the gate contract (`CuaAsk`, `GateAnswer`, `RunMode`,
# `WindowTrust`), the message draft and the provider trait. docket sits below cua and has no cua
# dependency.
docket-core     = { git = "https://github.com/PoHsuanLai/docket", rev = "6bce2528e185ce666f858b4ec54e0ed28430f8eb" }
docket-client   = { git = "https://github.com/PoHsuanLai/docket", rev = "6bce2528e185ce666f858b4ec54e0ed28430f8eb", default-features = false }

# Dev-dependencies of cuad's tests only: a real intentd on a private bus over docket's fakes, and
# a real memory service over almanac's fakes. Nothing outside `[dev-dependencies]` names them.
intentd         = { git = "https://github.com/PoHsuanLai/docket", rev = "6bce2528e185ce666f858b4ec54e0ed28430f8eb" }
docket-fake     = { git = "https://github.com/PoHsuanLai/docket", rev = "6bce2528e185ce666f858b4ec54e0ed28430f8eb" }
docket-router   = { git = "https://github.com/PoHsuanLai/docket", rev = "6bce2528e185ce666f858b4ec54e0ed28430f8eb" }
almanac-fake    = { git = "https://github.com/PoHsuanLai/almanac", rev = "a3a8a105c808ac54eb037083fb1a0217e9d6fbb1" }
almanac-service = { git = "https://github.com/PoHsuanLai/almanac", rev = "a3a8a105c808ac54eb037083fb1a0217e9d6fbb1" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines cua
# names itself.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8.2"
keyboard-types = { version = "0.7", features = ["serde"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }  # porter's line, narrowed to what cuad names: memfd_create and its seals
wayland-client = "0.31"
# libxkbcommon, narrowed: seat-input reads the keymap text only (no wayland keymap fds).
xkbcommon = { version = "0.8", default-features = false }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# The minor cosmic-comp's lock resolves.
reis = "0.7"
base64 = "0.22"
blake3 = "1"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
# docket's line: cuad waits for its bus connection to close.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Dev-dependencies.
proptest = "1"
tempfile = "3"

# NOT in quire's pinned block (FINDINGS: dependencies added here): the generator and the server
# side of the wayland crates, both already in every tree through wayland-protocols and
wayland-scanner = "0.31"
wayland-server  = "0.31"
wayland-backend = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
