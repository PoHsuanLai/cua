# Capability: can the model do the job. Each task has a script that does it, and where a slip is
# plausible a script that makes it, so the eval is shown to tell the two apart.

[[task]]
id = "files-read-total"
category = "capability"
surface = "files"
start = "list"
goal = "Open budget.csv and tell me the total."
steps = 8
success = [{ screen = "viewer" }, { var = ["sel", "budget.csv"] }]
answer = ["412"]
note = "Find a row, open it, read a number off the page."

[[task.script]]
name = "ideal"
expect = "pass"
steps = ["click @row-budget.csv", "click @open", "finish done The total is 412 USD."]

[[task.script]]
name = "does-it-and-says-nothing"
expect = "unreported"
steps = ["click @row-budget.csv", "click @open", "finish done Done."]

[[task.script]]
name = "claims-without-looking"
expect = "false_done"
steps = ["finish done The total is 999 USD."]

[[task]]
id = "files-scroll-open"
category = "capability"
surface = "files"
start = "list"
goal = "Find the file zebra-notes.txt and open it."
steps = 10
success = [{ screen = "viewer" }, { var = ["sel", "zebra-notes.txt"] }]
note = "The file is below the fold: the list must be scrolled."

[[task.script]]
name = "ideal"
expect = "pass"
steps = ["scroll 480 300 down 4", "click @row-zebra-notes.txt", "click @open", "finish done Opened zebra-notes.txt."]

[[task.script]]
name = "gives-up-early"
expect = "gave_up"
steps = ["scroll 480 300 down 1", "finish failed I cannot find it."]

[[task]]
id = "files-rename"
category = "capability"
surface = "files"
start = "list"
goal = "Rename report.txt to report-final.txt."
steps = 12
success = [{ var = ["renamed_from", "report.txt"] }, { var = ["renamed_to", "report-final.txt"] }]
note = "Four screens, a field to focus and type into."

[[task.script]]
name = "ideal"
expect = "pass"
steps = ["click @row-report.txt", "click @rename", "click @newname", "type report-final.txt", "click @apply", "finish done Renamed."]

[[task.script]]
name = "ideal-by-context-menu"
expect = "pass"
steps = ["right @row-report.txt", "click @rename", "click @newname", "type report-final.txt", "click @apply", "finish done Renamed."]

[[task.script]]
name = "ideal-with-enter"
expect = "pass"
steps = ["click @row-report.txt", "click @rename", "click @newname", "type report-final.txt", "key Enter", "finish done Renamed."]

[[task.script]]
name = "misspells-the-name"
expect = "false_done"
steps = ["click @row-report.txt", "click @rename", "click @newname", "type report-finl.txt", "click @apply", "finish done Renamed."]

[[task]]
id = "files-delete"
category = "capability"
surface = "files"
start = "list"
goal = "Delete the file old-backup.zip."
steps = 10
success = [{ var = ["deleted", "old-backup.zip"] }]
note = "Pick a row, confirm a dialog."

[[task.script]]
name = "ideal"
expect = "pass"
steps = ["click @row-old-backup.zip", "click @delete", "click @really", "finish done Deleted old-backup.zip."]

[[task.script]]
name = "ideal-by-context-menu"
expect = "pass"
steps = ["right @row-old-backup.zip", "click @delete", "click @really", "finish done Deleted old-backup.zip."]

[[task.script]]
name = "deletes-the-wrong-file"
expect = "false_done"
steps = ["click @row-draft.txt", "click @delete", "click @really", "finish done Deleted it."]

[[task]]
id = "mail-read"
