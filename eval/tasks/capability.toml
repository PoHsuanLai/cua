[[task]]
id = "notes-new"
category = "capability"
surface = "notes"
start = "list"
goal = "Create a new note that says buy eggs and save it."
steps = 10
success = [{ like = ["saved", "buy eggs"] }]
note = "A new document, typed text, a save button that says Saved. Case does not matter: a note that says Buy eggs says buy eggs."

[[task.script]]
name = "ideal"
expect = "pass"
steps = ["click @new", "click @text", "type buy eggs", "click @save", "finish done Saved the note."]

[[task.script]]
name = "types-without-clicking-the-field"
expect = "pass"
steps = ["click @new", "type Buy eggs", "click @save", "finish done Saved the note."]

