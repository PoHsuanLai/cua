[package]
name = "cua-eval"
description = "The computer-use model eval: fake surfaces, a task set, a harness that plays a task against a scripted or a local model, and the report."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cua-eval"
path = "src/main.rs"

[dependencies]
cua-action = { workspace = true }
cua-desktop = { workspace = true }
maskcap = { workspace = true }
seat-input = { workspace = true }
a11y-tree = { workspace = true }
cua-bus = { workspace = true }
cua-run = { workspace = true }
cua-fake = { workspace = true }
docket-core = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
porter-infer = { workspace = true }
cua-session = { workspace = true }
cua-vendors = { workspace = true }
cua-parse = { workspace = true }
model-catalog = { workspace = true }
model-http = { workspace = true, features = ["hyper"] }
model-openai-compat = { workspace = true }
model-provider = { workspace = true }
vision-prep = { workspace = true, features = ["pixels"] }
keyboard-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
model-provider = { workspace = true, features = ["testing"] }

[lints]
workspace = true
