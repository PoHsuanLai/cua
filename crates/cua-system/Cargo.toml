[package]
name = "cua-system"
description = "The system adapters of computer use: the real seams of a running desktop (casement's desktop, capture over wayland, input over EIS, the AT-SPI tree), the model over inferd, and the links to the router's gate and memoryd. The daemon in cuad wires them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cua-desktop = { workspace = true }
desktop-client = { workspace = true }
maskcap = { workspace = true }
maskcap-wayland = { workspace = true }
seat-input = { workspace = true }
seat-ei = { workspace = true }
a11y-tree = { workspace = true }
a11y-atspi = { workspace = true }
cua-run = { workspace = true }
cua-host = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
porter-core = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
almanac-client = { workspace = true, features = ["dbus"] }
wayland-client = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
cua-action = { workspace = true }

[lints]
workspace = true
