[package]
name = "quire-agent-protocol"
description = "Generated bindings for quire-agent-v1, the private protocol between cuad and the quire fork of cosmic-comp. Features `client` (cuad) and `server` (the fork)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wayland-scanner = { workspace = true }
wayland-backend = { workspace = true }
wayland-client = { workspace = true, optional = true }
wayland-server = { workspace = true, optional = true }
wayland-protocols = { workspace = true }

[features]
# cuad's side.
client = ["dep:wayland-client", "wayland-protocols/client"]
# The fork's side. The fork depends on this crate by git rev with only this feature.
server = ["dep:wayland-server", "wayland-protocols/server"]

[lints]
workspace = true
