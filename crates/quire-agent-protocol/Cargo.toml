[package]
name = "quire-agent-protocol"
description = "cua's paths for quire-agent-v1: a re-export of casement-protocols, where the XML and the bindings live. Features `client` (cuad) and `server` (the compositor)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The one home of the XML. Sibling checkouts sit side by side, as stoker, porter and docket do.
casement-protocols = { path = "../../../casement-protocols" }

[features]
# cuad's side.
client = ["casement-protocols/client"]
# The compositor's side.
server = ["casement-protocols/server"]

[lints]
workspace = true
