[package]
name = "cuad"
description = "The computer-use daemon and its library: the backends, the supervisor of runs, the seams over D-Bus (the router's gate, inferd, memoryd), the org.quire.Cua provider and org.quire.Cua1. The binary serves both names on the session bus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cuad"
path = "src/lib.rs"

[[bin]]
name = "cuad"
path = "src/main.rs"

[dependencies]
cua-desktop = { workspace = true, features = ["wayland"] }
maskcap = { workspace = true, features = ["wayland"] }
seat-input = { workspace = true, features = ["ei"] }
a11y-tree = { workspace = true, features = ["atspi"] }
cua-bus = { workspace = true }
cua-run = { workspace = true }
cua-host = { workspace = true }
cua-dbus = { workspace = true }
docket-core = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
prov = { workspace = true }
porter-core = { workspace = true }
porter-daemon = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
almanac-client = { workspace = true, features = ["dbus"] }
wayland-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
zbus = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
almanac-core = { workspace = true }
cua-action = { workspace = true }
cua-fake = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
intentd = { workspace = true }
docket-fake = { workspace = true }
docket-router = { workspace = true }
almanac-fake = { workspace = true }
almanac-service = { workspace = true }
almanac-client = { workspace = true, features = ["dbus", "in_process"] }

[lints]
workspace = true
