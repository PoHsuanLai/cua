[package]
name = "cuad"
description = "The computer-use daemon and its library: the supervisor of runs wired to the system seams of cua-system, the org.quire.Cua provider and org.quire.Cua1. The binary serves both names on the session bus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cuad"
path = "src/lib.rs"

[[bin]]
name = "cuad"
path = "src/main.rs"

[features]
# The person's own keymap (and this desktop's bindings) from keycap, for the shortcut line the
# model is told. On for the daemon; off, only the platform's conventions apply.
default = ["keycap"]
keycap = ["dep:keycap-client"]
# A test build only: callers are read from a fixture process tree and a callers file the harness
# names (`CUAD_TEST_PROC_ROOT`, `CUAD_TEST_SYSTEM_CALLERS`) in place of `/proc` and `/etc/quire`.
# Never on in a shipped build.
fixture-callers = ["docket-dbus/fixture-callers"]

[dependencies]
docket-wire = { workspace = true }
docket-manifest = { workspace = true }
docket-vocab = { workspace = true }
porter-ids = { workspace = true }
cua-desktop = { workspace = true }
cua-system = { workspace = true }
cua-bus = { workspace = true }
cua-run = { workspace = true }
chordkit = { workspace = true }
keycap-client = { workspace = true, optional = true }
cua-host = { workspace = true }
cua-dbus = { workspace = true }
docket-core = { workspace = true }
docket-client = { workspace = true, features = ["dbus"] }
docket-provider = { workspace = true, features = ["dbus"] }
docket-dbus = { workspace = true }
prov = { workspace = true }
porter-core = { workspace = true }
porter-daemon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
zbus = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
docket-gate-wire = { workspace = true }
docket-permissions-core = { workspace = true }
porter-capability = { workspace = true }
# The tests present their processes as a fixture tree, which porter reads only in a test build.
docket-dbus = { workspace = true, features = ["fixture-callers"] }
almanac-core = { workspace = true }
cua-action = { workspace = true }
cua-fake = { workspace = true }
porter-infer = { workspace = true }
model-provider = { workspace = true }
rust_decimal = { workspace = true }
seat-input = { workspace = true }
maskcap = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
intentd = { workspace = true }
docket-fake = { workspace = true }
docket-router = { workspace = true }
almanac-fake = { workspace = true }
almanac-service = { workspace = true }
almanac-client = { workspace = true, features = ["dbus", "in_process"] }

[lints]
workspace = true
