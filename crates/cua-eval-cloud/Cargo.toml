[package]
name = "cua-eval-cloud"
description = "The computer-use eval against a hosted model: a stoker Provider that asks porter's inferd for a chat turn over the bus (the API key stays in accountd and inferd), and the cua-eval-cloud binary that plays the task set on it under a spend and step budget."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cua_eval_cloud"
path = "src/lib.rs"

[[bin]]
name = "cua-eval-cloud"
path = "src/main.rs"

[dependencies]
porter-match = { workspace = true }
porter-capability = { workspace = true }
porter-ids = { workspace = true }
cua-eval = { workspace = true }
model-catalog = { workspace = true }
model-provider = { workspace = true }
inferd-client = { workspace = true, features = ["dbus"] }
porter-core = { workspace = true }
porter-infer = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
vision-prep = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
rust_decimal = { workspace = true }

[lints]
workspace = true
